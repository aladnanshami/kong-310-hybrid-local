services:
  kong-db:
    image: postgres:16
    container_name: kong-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    ports:
      - "5432:5432"
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 20

  kong-migrations:
    image: ${KONG_IMAGE:-kong/kong-gateway:3.10}
    container_name: kong-migrations
    command: kong migrations bootstrap
    restart: on-failure
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    networks:
      - kong-net

  kong-cp:
    image: ${KONG_IMAGE:-kong/kong-gateway:3.10}
    container_name: kong-cp
    restart: unless-stopped
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_ROLE: control_plane
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong

      # Hybrid CP/DP mTLS certs
      KONG_CLUSTER_CERT: /etc/kong/certs/cluster.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/cluster.key

      # CP listeners
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
      KONG_CLUSTER_LISTEN: 0.0.0.0:8005 ssl
      KONG_CLUSTER_TELEMETRY_LISTEN: 0.0.0.0:8006 ssl

      # URLs visible from your Mac host
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_GUI_API_URL: http://localhost:8001

      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8001:8001"   # Admin API HTTP
      - "8444:8444"   # Admin API HTTPS
      - "8002:8002"   # Kong Manager HTTP
      - "8445:8445"   # Kong Manager HTTPS
      - "8005:8005"   # Hybrid cluster traffic from DP
      - "8006:8006"   # Hybrid telemetry from DP
    volumes:
      - ./certs:/etc/kong/certs:ro
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 20

  kong-dp1:
    image: ${KONG_IMAGE:-kong/kong-gateway:3.10}
    container_name: kong-dp1
    restart: unless-stopped
    depends_on:
      kong-cp:
        condition: service_healthy
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"

      # Hybrid DP -> CP
      KONG_CLUSTER_CONTROL_PLANE: kong-cp:8005
      KONG_CLUSTER_TELEMETRY_ENDPOINT: kong-cp:8006
      KONG_CLUSTER_MTLS: shared
      KONG_CLUSTER_SERVER_NAME: kong_clustering
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: kong_clustering
      KONG_CLUSTER_DP_LABELS: hostname:kong-cp

      # Same shared mTLS cert/key pair copied to DP nodes
      KONG_CLUSTER_CERT: /etc/kong/certs/cluster.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/cluster.key

      # DP proxy listeners only
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"

      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports:
      - "8100:8000"   # DP1 proxy HTTP from Mac
      - "8143:8443"   # DP1 proxy HTTPS from Mac
    volumes:
      - ./certs:/etc/kong/certs:ro
    networks:
      - kong-net

  kong-dp2:
    image: ${KONG_IMAGE:-kong/kong-gateway:3.10}
    container_name: kong-dp2
    restart: unless-stopped
    depends_on:
      kong-cp:
        condition: service_healthy
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"

      # Hybrid DP -> CP
      KONG_CLUSTER_CONTROL_PLANE: kong-cp:8005
      KONG_CLUSTER_TELEMETRY_ENDPOINT: kong-cp:8006
      KONG_CLUSTER_MTLS: shared
      KONG_CLUSTER_SERVER_NAME: kong_clustering
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: kong_clustering
      KONG_CLUSTER_DP_LABELS: hostname:kong-cp

      # Same shared mTLS cert/key pair copied to DP nodes
      KONG_CLUSTER_CERT: /etc/kong/certs/cluster.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/cluster.key

      # DP proxy listeners only
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"

      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports:
      - "8200:8000"   # DP2 proxy HTTP from Mac
      - "8243:8443"   # DP2 proxy HTTPS from Mac
    volumes:
      - ./certs:/etc/kong/certs:ro
    networks:
      - kong-net

  # Local NLB-like reverse proxy in front of both Data Planes.
  # apigw.placsoft.local -> localhost:8443 -> nginx -> kong-dp1/kong-dp2:8443
  dp-lb:
    image: nginx:1.27-alpine
    container_name: kong-dp-lb
    restart: unless-stopped
    depends_on:
      - kong-dp1
      - kong-dp2
    ports:
      - "8080:8080"   # local LB HTTP
      - "8443:8443"   # local LB HTTPS, mapped to apigw.placsoft.local
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - kong-net

volumes:
  kong-db-data:

networks:
  kong-net:
    name: kong-net
